the step -- at k the cover would have (k-1+1)*m points and the barrier \
constant would move."""

[[mutation]]
id = "er-profile-drop-the-factorial"
file = "coq/Profile.v"
question = """Is Erdos-Rado's profile greedy-closed because of the \
