Is the factorial in Erdos-Rado exactly that m?"""
find = """  forall m, 1 <= m -> m <= n -> (k - 1) * m * B (m - 1) <= B m."""
replace = """  forall m, 1 <= m -> m <= n -> (k - 1) * B (m - 1) <= B m."""
expect = "killed"
because = """It is exactly that m. Without it the unrolled bound is \
(k-1)^m, not (k-1)^m * m!, so greedy_forces_erdos_rado no longer holds; \
and greedy_closes_profile loses the cover arithmetic, since the cover \
has (k-1)*m points and not (k-1). The factorial in the 1960 bound is \
the factor m paid once per level, and this mutation is the check."""

[[mutation]]
