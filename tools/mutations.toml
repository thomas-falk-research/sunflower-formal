replace = """    NoDup T -> deg T F <= B (m - length T)."""
expect = "killed"
because = """Load-bearing, and for the reason the decision procedure \
exists: at T = [] the condition reads |F| <= B m, which contradicts the \
size hypothesis B m < |F| outright. profile_witness_none cannot produce \
it -- profile_violatesb returns false on [] by construction -- so the \
reduction loses its "no violation" branch."""

[[mutation]]
id = "greedyclosed-drop-the-level-factor"
file = "coq/Profile.v"
question = """GreedyClosed carries the factor m -- one point per member \
