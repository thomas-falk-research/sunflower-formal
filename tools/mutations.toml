# The mutation manifest.
#
# Each entry perturbs one definition and records what the perturbation
# is asking. `find` must occur exactly once in `file`; the runner
# refuses to proceed otherwise, so a manifest that has drifted out of
# step with the sources is a hard error rather than a silent skip.
#
# `expect` is one of three outcomes:
#
#   killed         the development must stop compiling -- the
#                  hypothesis is load-bearing;
#   killed-script  it stops compiling, but only because some tactic no
#                  longer applies. The entry must supply `repairs`:
#                  purely tactical edits, touching no statement, that
#                  restore the build. The harness applies them and
#                  checks. This is the machine-checked way of saying
#                  "the proofs noticed, the mathematics did not";
#   survived       it still compiles -- no theorem in the development
#                  is sensitive to the change at all.
#
# Anything other than a plain `killed` must carry a `because`.
# Survivors and script-level kills are not failures of the harness;
# they are its output.
#
# `expect` is checked, so this file is a regression test on the
# load-bearingness of every hypothesis, not just a report.

# ----------------------------------------------------------------
# The historical defect, re-injected.
# ----------------------------------------------------------------

[[mutation]]
id = "spread-drop-nodup"
file = "coq/Spread.v"
question = """Does dropping NoDup from the fractional spread condition — \
the exact defect recorded in w_spread_legacy_degenerate — still break the build?"""
find = "  forall T : list nat, NoDup T -> r ^ (length T) * deg T F <= length F."
replace = "  forall T : list nat, r ^ (length T) * deg T F <= length F."
expect = "killed"

[[mutation]]
id = "raospread-drop-nodup"
file = "coq/Spread.v"
question = "Is the NoDup guard on Rao's absolute spread condition load-bearing?"
find = """    NoDup T -> T <> [] -> deg T F <= r ^ (m - length T)."""
replace = """    T <> [] -> deg T F <= r ^ (m - length T)."""
expect = "killed"

[[mutation]]
id = "raospread-drop-nonempty"
file = "coq/Spread.v"
question = """Rao's condition quantifies only over nonempty Z. Does dropping \
that make the condition unsatisfiable together with r^m < |F|?"""
find = """    NoDup T -> T <> [] -> deg T F <= r ^ (m - length T)."""
replace = """    NoDup T -> NoDup T -> deg T F <= r ^ (m - length T)."""
expect = "killed"

# ----------------------------------------------------------------
# Exponents and inequalities in the spread conditions.
# ----------------------------------------------------------------

[[mutation]]
id = "raospread-flat-exponent"
file = "coq/Spread.v"
question = """The degree cap is r^(m-|T|), decreasing in |T|. Does a flat cap \
of r^m — the same statement with the subtraction dropped — weaken it enough \
to notice?"""
find = """    NoDup T -> T <> [] -> deg T F <= r ^ (m - length T)."""
replace = """    NoDup T -> T <> [] -> deg T F <= r ^ m."""
expect = "killed"

[[mutation]]
id = "raospread-off-by-one"
file = "coq/Spread.v"
question = "Does loosening the degree cap by one break anything?"
find = """    NoDup T -> T <> [] -> deg T F <= r ^ (m - length T)."""
replace = """    NoDup T -> T <> [] -> deg T F <= r ^ (m - length T) + 1."""
expect = "killed"

[[mutation]]
id = "spread-strict"
file = "coq/Spread.v"
question = """Should the fractional spread inequality be strict? If < worked \
as well as <=, the boundary case T = [] would be doing nothing."""
find = "  forall T : list nat, NoDup T -> r ^ (length T) * deg T F <= length F."
replace = "  forall T : list nat, NoDup T -> r ^ (length T) * deg T F < length F."
expect = "killed"

# ----------------------------------------------------------------
# The decision procedure. A too-small candidate enumeration would
# silently weaken the reduction rather than break a proof; this is the
# mutation that Reflect.rao_witness_agrees exists to catch.
# ----------------------------------------------------------------

[[mutation]]
id = "cands-members-only"
file = "coq/Spread.v"
question = """rao_witness searches the sublists of members. If it searched only \
the members themselves, would anything notice?"""
find = "Definition cands (F : Family) : list (list nat) := concat (map subsets F)."
replace = "Definition cands (F : Family) : list (list nat) := F."
expect = "killed"

[[mutation]]
id = "violatesb-swapped"
file = "coq/Spread.v"
question = "Is the direction of the violation test checked anywhere?"
find = "  | _ :: _ => Nat.ltb (r ^ (m - length T)) (deg T F)"
replace = "  | _ :: _ => Nat.ltb (deg T F) (r ^ (m - length T))"
expect = "killed"

[[mutation]]
id = "link-unfiltered"
file = "coq/Spread.v"
question = """The link keeps only the members containing T. Does keeping all of \
them break the reduction?"""
find = "  map (fun A => setminus A T) (filter (containsb T) F)."
replace = "  map (fun A => setminus A T) F."
expect = "killed"

# ----------------------------------------------------------------
# The core combinatorial definitions.
# ----------------------------------------------------------------

[[mutation]]
id = "distinct-is-nodup"
file = "coq/Sunflower.v"
question = """Distinct is SetNoDup, not NoDup, so that [0;1] and [1;0] count as \
one set. Does the weaker literal version break anything?"""
find = "Definition Distinct (F : Family) : Prop := SetNoDup F."
replace = "Definition Distinct (F : Family) : Prop := NoDup F."
expect = "killed"

[[mutation]]
id = "sunflower-nodup-petals"
file = "coq/Sunflower.v"
question = "Are the petals of a sunflower required to be distinct as sets?"
find = "  SetNoDup S /\\"
replace = "  NoDup S /\\"
expect = "killed"

[[mutation]]
id = "ksunflower-at-least"
file = "coq/Sunflower.v"
question = "Does a k-sunflower have exactly k petals, or at least k?"
find = "  length S = k /\\ exists core, Sunflower S core."
replace = "  length S >= k /\\ exists core, Sunflower S core."
expect = "killed"

[[mutation]]
id = "uniform-at-most"
file = "coq/Sunflower.v"
question = "Is n-uniformity an equality or a bound?"
find = "  length A = n /\\ NoDup A."
replace = "  length A <= n /\\ NoDup A."
expect = "killed"

[[mutation]]
id = "upperbound-strict"
file = "coq/Sunflower.v"
question = "Off-by-one in the size threshold of UpperBound."
find = "    Uniform n F -> Distinct F -> length F >= m ->"
replace = "    Uniform n F -> Distinct F -> length F > m ->"
expect = "killed"

[[mutation]]
id = "lowerbound-at-least"
file = "coq/Sunflower.v"
question = "LowerBound pins the family size exactly. Is the equality used?"
find = "    Uniform n F /\\ Distinct F /\\ length F = m /\\ ~ ContainsKSunflower k F."
replace = "    Uniform n F /\\ Distinct F /\\ length F >= m /\\ ~ ContainsKSunflower k F."
expect = "survived"
because = """A genuine survivor, and the only one: the equality carries no \
mathematical weight. Audit.LowerBound_ge_equiv proves the two forms define the \
same predicate -- take the first m members of a sunflower-free family of size at \
least m -- so no theorem can distinguish them, and the equality in the definition \
is documentation rather than a constraint.

This used to be declared `killed-script`, with four `apply H` steps repaired \
because their goal had turned from `=` into `<=`. That was an artefact of how \
those four proofs were written, not a fact about the definition, and it had the \
failure mode such artefacts have: adding CliqueLowerBound.two_cliques_lower_bound \
-- a theorem with no bearing on this question -- turned the outcome into `killed` \
and failed the build. The five size-hypothesis steps are now written as \
`rewrite ...; lia`, which proves the goal in either form, so what this mutation \
reports is a property of the definition rather than of the tactic scripts.

A survivor here is the *expected* outcome, checked against the manifest like any \
other. If it were ever killed again, some theorem would have started depending on \
the equality, and LowerBound_ge_equiv would be the thing to re-examine."""

[[mutation]]
id = "subfamily-literal"
file = "coq/Sunflower.v"
question = """A subfamily is taken up to set-equality of members. Does requiring \
literal equality break the sunflower lifts?"""
find = "  forall A, In A S -> exists B, In B F /\\ SetEq A B."
replace = "  forall A, In A S -> exists B, In B F /\\ A = B."
expect = "killed"

# ----------------------------------------------------------------
# The reduction and its interface.
# ----------------------------------------------------------------

[[mutation]]
id = "syd-nonstrict-size"
file = "coq/SpreadReduction.v"
question = "Is the size hypothesis r^m < |F| strict where it is used?"
find = "    r ^ m < length F ->"
replace = "    r ^ m <= length F ->"
expect = "killed"

[[mutation]]
id = "syd-at-least-k"
file = "coq/SpreadReduction.v"
question = """The spread lemma yields exactly k pairwise disjoint sets. Does \
'at least k' suffice for the reduction?"""
find = "      incl S F /\\ NoDup S /\\ length S = k /\\ PairwiseDisjoint S."
replace = "      incl S F /\\ NoDup S /\\ length S >= k /\\ PairwiseDisjoint S."
expect = "killed"

[[mutation]]
id = "reduction-off-by-one"
file = "coq/SpreadReduction.v"
question = "Is the +1 in the bound f(m,k) <= r^m + 1 load-bearing?"
find = "    forall m, m <= n -> UpperBound m k (S (r ^ m))."
replace = "    forall m, m <= n -> UpperBound m k (r ^ m)."
expect = "killed"

# ----------------------------------------------------------------
# The axiom.
# ----------------------------------------------------------------

[[mutation]]
id = "axiom-exponent"
file = "coq/ALWZ.v"
question = "Is the exponent in the derived modern bound checked by the reduction?"
find = "      UpperBound n k (S ((alpha * k * Nat.log2_up (S (k * n))) ^ n))."
replace = "      UpperBound n k (S ((alpha * k * Nat.log2_up (S (k * n))) ^ (n - 1)))."
expect = "killed"

[[mutation]]
id = "axiom-threshold-squared"
file = "coq/ALWZ.v"
question = """The axiom demands r >= alpha*k*log(kn). Does demanding more of r — \
which makes the axiom strictly weaker, hence safer — still let the modern bound \
be derived?"""
find = "      alpha * k * Nat.log2_up (S (k * n)) <= r ->"
replace = "      alpha * k * k * Nat.log2_up (S (k * n)) <= r ->"
expect = "killed"

# ----------------------------------------------------------------
# The finite-set layer.
# ----------------------------------------------------------------

# ----------------------------------------------------------------
# A positive control.
#
# Nearly every mutation here is expected to break something. If the
# harness were broken -- a sandbox that fails to build for an unrelated
# reason, an edit that silently fails to apply -- every mutation would
# report `killed` and the suite would still pass. This one must
# survive, so the `survived` path is exercised on every run whatever
# the development does. (`lowerbound-at-least` also survives, but that
# is a fact about the development, and could change.)
# ----------------------------------------------------------------

[[mutation]]
id = "canary-alpha-rename"
file = "coq/Sets.v"
question = """Control: renaming a bound variable changes nothing. If this is \
reported killed, the harness is broken, not the development."""
find = "Definition Subset (A B : list nat) : Prop := forall x, In x A -> In x B."
replace = "Definition Subset (A B : list nat) : Prop := forall e, In e A -> In e B."
expect = "survived"
control = true
because = """Alpha-equivalence: Coq terms are identified up to the names of \
bound variables, so this is not a change to the development at all. It is here \
to prove the suite can report `survived` independently of anything the \
development happens to prove."""

[[mutation]]
id = "seteq-one-sided"
file = "coq/Sets.v"
question = "Is set equality really mutual inclusion?"
find = "Definition SetEq (A B : list nat) : Prop := Subset A B /\\ Subset B A."
replace = "Definition SetEq (A B : list nat) : Prop := Subset A B /\\ Subset A B."
expect = "killed"

[[mutation]]
id = "disjoint-vacuous"
file = "coq/Sets.v"
question = "Would a vacuous notion of disjointness be noticed?"
find = """Definition Disjoint (A B : list nat) : Prop :=
  forall x, In x A -> In x B -> False."""
replace = """Definition Disjoint (A B : list nat) : Prop :=
  forall x, In x A -> In x B -> True."""
expect = "killed"

# ----------------------------------------------------------------
# Uniformity 2: the characterisation and the identification
#
# coq/TwoUniform.v turns two questions into one extremal problem, and
# both directions of that turn have hypotheses that could quietly stop
# carrying weight. These ask whether they still do.
# ----------------------------------------------------------------

[[mutation]]
id = "twouniform-degree-off-by-one"
file = "coq/TwoUniform.v"
question = """The characterisation bounds the maximum degree by k-1. Is the \
strictness real, or would k do?"""
find = "forall v, deg [v] F < k"
replace = "forall v, deg [v] F <= k"
expect = "killed"

[[mutation]]
id = "star-sunflower-uniformity-3"
file = "coq/TwoUniform.v"
question = """star_sunflower says 2-sets through a point are a sunflower. Is \
uniformity 2 load-bearing, or would any fixed uniformity do?"""
find = "    Forall (UniformSet 2) S ->"
replace = "    Forall (UniformSet 3) S ->"
expect = "killed"
because = """It is load-bearing, and Audit.star_needs_uniformity_two is the \
counterexample the kill corresponds to: [1;2;3], [1;2;4], [1;3;5] all contain 1 \
and have pairwise intersections {1,2} and {1,3}, so no common core exists at all. \
If this survived, the whole sunflower problem would be a statement about degrees \
at every uniformity, which is exactly what it is not."""

[[mutation]]
id = "rao-two-nodup-not-distinct"
file = "coq/TwoUniform.v"
question = """The spread condition at uniformity 2 collapses to a degree bound. \
Is Distinct what makes it collapse, or would NoDup do?"""
find = """    Uniform 2 F -> Distinct F ->
    (RaoSpread 2 F r <-> forall v, deg [v] F <= r)."""
replace = """    Uniform 2 F -> NoDup F ->
    (RaoSpread 2 F r <-> forall v, deg [v] F <= r)."""
expect = "killed"
because = """Distinct is exactly what supplies the |T| = 2 clause -- deg T F <= \
r^0 = 1 -- and NoDup does not. Audit.distinct_is_load_bearing_in_the_degree_ \
identification exhibits the separating family: [0;1] and [1;0] are one set \
written twice, every vertex has degree 2, and the family is not 2-spread because \
the 2-set {0,1} lies in two members. Same family as distinct_strictly_stronger, \
which is the point -- that design choice is what makes this identification true."""

[[mutation]]
id = "haskdisjoint-drop-nodup"
file = "coq/TwoUniform.v"
question = "Does HasKDisjoint need its members to be distinct?"
find = "    incl S F /\\ NoDup S /\\ length S = k /\\ PairwiseDisjoint S."
replace = "    incl S F /\\ True /\\ length S = k /\\ PairwiseDisjoint S."
expect = "killed"
because = """Replaced by True rather than deleted, so the conjunction keeps its \
shape and every destructuring pattern still applies -- what breaks is the \
mathematics, not the intro patterns. Without NoDup, [[0;1];[0;1]] is a \
"pairwise disjoint" family of size 2 (the condition quantifies over A <> B, and \
there is no such pair), so HasKDisjoint 2 would hold of a one-edge family that \
has no 2-sunflower."""

[[mutation]]
id = "clique-matching-slack"
file = "coq/CliqueLowerBound.v"
question = """The matching bound on each clique is tight. Does the parity \
argument need the tightness, or only the bound?"""
find = "length S = s0 + s1 /\\ 2 * s0 <= length U0 /\\ 2 * s1 <= length U1."
replace = "length S = s0 + s1 /\\ 2 * s0 <= length U0 + 1 /\\ 2 * s1 <= length U1 + 1."
expect = "killed"
because = """The mutated lemma is still *true* -- it is strictly weaker. What \
dies is two_cliques_no_sunflower, which is the point: the whole construction \
works because k disjoint edges would need every one of the 2k vertices matched, \
and one vertex of slack per component is exactly enough to let an odd component \
off the hook. This is the mutation that says the oddness argument is doing the \
work, not the counting."""

# ----------------------------------------------------------------
# The link characterisation.
# ----------------------------------------------------------------

[[mutation]]
id = "link-char-drop-k-bound"
file = "coq/LinkCharacterisation.v"
question = """The full equivalence needs no hypothesis on k, but the \
sunflower-to-link direction is stated with 2 <= k. Is that hypothesis real, or \
an artefact of routing through contains_sunflower_literal?"""
find = """  forall k F,
    2 <= k -> ContainsKSunflower k F ->
    exists Y, (exists A, In A F /\\ Subset Y A) /\\ HasKDisjoint k (link Y F)."""
replace = """  forall k F,
    ContainsKSunflower k F ->
    exists Y, (exists A, In A F /\\ Subset Y A) /\\ HasKDisjoint k (link Y F)."""
expect = "killed"
because = """It is real, and the mutated statement is *false*, not merely \
unproved: at k = 0 the empty family contains the empty sunflower, and the \
conclusion asserts a member of it. The 2 <= k is what makes "the core lies \
inside a member" available, and small_sunflower_gives_link_matching is why the \
full equivalence still needs no hypothesis on k -- it routes k <= 1 through the \
empty core instead."""

[[mutation]]
id = "small-cores-drop-uniformity"
file = "coq/LinkCharacterisation.v"
question = """At uniformity 2 every core that carries a matching has at most one \
point. Is the uniformity doing the work, or would any distinct family do?"""
find = """    2 <= k -> Uniform 2 F -> Distinct F ->
    HasKDisjoint k (link Y F) ->
    forall u v, In u Y -> In v Y -> u = v."""
replace = """    2 <= k -> Distinct F ->
    HasKDisjoint k (link Y F) ->
    forall u v, In u Y -> In v Y -> u = v."""
expect = "killed"
because = """The uniformity is the whole content, and the mutated statement is \
false: Audit.core_of_size_two_is_needed exhibits a distinct 3-uniform family \
whose only working core is {0,1}. This is the mutation that says TwoUniform.v is \
a statement about graphs rather than about sunflowers -- and the exhaustive \
enumeration in rust/tests/link_characterisation.rs kills the same reading \
computationally, at uniformity 3 and on non-uniform families both."""

[[mutation]]
id = "link-char-common-point-one"
file = "coq/LinkCharacterisation.v"
question = """two_common_points_force_a_big_core needs *two* shared points. Is \
the second one load-bearing, or would one common point already force a big \
core?"""
find = """    2 <= k -> u <> v ->
    Forall (fun A => In u A) F -> Forall (fun A => In v A) F ->
    HasKDisjoint k (link Y F) ->
    exists a b, In a Y /\\ In b Y /\\ a <> b."""
replace = """    2 <= k -> u <> v ->
    Forall (fun A => In u A) F -> Forall (fun A => In u A) F ->
    HasKDisjoint k (link Y F) ->
    exists a b, In a Y /\\ In b Y /\\ a <> b."""
expect = "killed"
because = """Load-bearing, and the mutated statement is false: a star of 2-sets \
through one point has a k-sunflower with the singleton core {u}, which has no \
two distinct points -- Audit.both_sunflower_shapes_occur is exactly that family. \
One shared point forces a *nonempty* core, not a big one. The mutation replaces \
the second hypothesis with a copy of the first rather than deleting it, so the \
arity and every intro pattern are unchanged and what breaks is the mathematics."""

# ----------------------------------------------------------------
# The direct sum. Both hypotheses of sum_family_no_sunflower, and the
# one arithmetic claim that says the new bound beats the old one.
# ----------------------------------------------------------------

[[mutation]]
id = "directsum-drop-uniformity"
file = "coq/DirectSum.v"
question = """The direct sum needs the first family to be uniform. Is that \
load-bearing, or an artefact of splitting members with firstn?"""
find = """    2 <= k ->
    Uniform a F1 ->
    ~ ContainsKSunflower k F1 -> ~ ContainsKSunflower k F2 ->"""
replace = """    2 <= k ->
    Distinct F1 ->
    ~ ContainsKSunflower k F1 -> ~ ContainsKSunflower k F2 ->"""
expect = "killed"
because = """Load-bearing, and the mutated statement is *false*, not merely \
unproved: Audit.uniformity_is_needed_in_the_direct_sum exhibits two two-member \
families on disjoint ground sets, neither containing a 3-sunflower, whose direct \
sum contains one -- and both are Distinct, which is what the mutation substitutes. \
The hypothesis is replaced rather than deleted, so the arity and every intro \
pattern are unchanged and what breaks is the mathematics: the proof splits each \
member at position a and needs |A| = a to do it.

This entry replaced an earlier one that mutated `Uniform b F2`. The runner \
reported it killed, but only at the call site in lower_bound_sum -- the proof of \
sum_family_no_sunflower never used that hypothesis, nor Distinct on either side. \
All three were removed from the statement rather than left as decoration."""

[[mutation]]
id = "directsum-drop-cross"
file = "coq/DirectSum.v"
question = """Cross-disjointness is what makes the two halves of a member \
recoverable. Does anything downstream survive without it?"""
find = """    Uniform a F1 -> Uniform b F2 -> CrossDisjoint F1 F2 ->
    Uniform (a + b) (sum_family F1 F2)."""
replace = """    Uniform a F1 -> Uniform b F2 -> Uniform b F2 ->
    Uniform (a + b) (sum_family F1 F2)."""
expect = "killed"
because = """Load-bearing one step earlier than the sunflower argument: without \
disjoint ground sets the concatenation repeats a point, so the sum is not a family \
of sets at all and NoDup_app_intro has nothing to apply to. As above the \
hypothesis is replaced rather than deleted, so the failure is not an arity \
mismatch."""

[[mutation]]
id = "directsum-power-off-by-one"
file = "coq/DirectSum.v"
question = """lower_bound_power iterates the sum t times at uniformity a. Does \
anything notice if the exponent and the uniformity fall out of step?"""
find = "  forall a k p t, 2 <= k -> LowerBound a k p -> LowerBound (t * a) k (p ^ t)."
replace = "  forall a k p t, 2 <= k -> LowerBound a k p -> LowerBound (t * a) k (p ^ S t)."
expect = "killed"
because = """The uniformity and the size are tied together by the induction: \
[t] copies of an [a]-uniform family of [p] members give [t*a]-uniform and [p^t], \
and asking for [p^(t+1)] members out of the same construction is false. This is \
the arithmetic that [cliques_beat_product] then compares against, so an \
undetected slip here would silently inflate the headline bound."""

# ----------------------------------------------------------------
# Which restrictions of the spread lemma have content.
# ----------------------------------------------------------------

[[mutation]]
id = "restrictions-fresh-not-fresh"
file = "coq/SpreadRestrictions.v"
question = """The lifted core is taken one point *above* the family's ground set. \
Is the [S] load-bearing, or would the maximum itself do?"""
find = """Definition fresh_block (G : Family) (d : nat) : list nat :=
  block (S (ground_max G)) d."""
replace = """Definition fresh_block (G : Family) (d : nat) : list nat :=
  block (ground_max G) d."""
expect = "killed"
because = """Load-bearing, and the mutated construction is wrong rather than \
merely unproved: starting at the maximum itself puts the core's first point \
inside the family's ground set, so the glued members repeat a point and the link \
no longer recovers G. Everything in the file rests on that disjointness."""

[[mutation]]
id = "restrictions-drop-freeness"
file = "coq/SpreadRestrictions.v"
question = """sunflower_free_bounded bounds *sunflower-free* families. Is that \
hypothesis what makes the induction go through, or is it decoration?"""
find = """      Uniform m F -> Distinct F -> ~ ContainsKSunflower k F ->
      length F <= r ^ m."""
replace = """      Uniform m F -> Distinct F -> Distinct F ->
      length F <= r ^ m."""
expect = "killed"
because = """Load-bearing twice over, and the mutated statement is false: without \
it the claim is that every uniform distinct family has at most r^m members, which \
Audit.no_upper_bound_below_exponential already refutes. In the proof it is needed \
both to pass sunflower-freeness down to the link and to apply the restricted \
spread hypothesis at the base. The hypothesis is replaced by a copy of its \
neighbour rather than deleted, so the arity is unchanged."""

# ----------------------------------------------------------------
# The polynomial method.
# ----------------------------------------------------------------

[[mutation]]
id = "slicerank-exactly-two-loses-a-case"
file = "coq/SliceRank.v"
question = """"In exactly two" has three cases, one per omitted set. Does the \
sunflower characterisation notice if one is lost?"""
find = """  (In x A /\\ In x B /\\ ~ In x C)
  \\/ (In x A /\\ ~ In x B /\\ In x C)
  \\/ (~ In x A /\\ In x B /\\ In x C)."""
replace = """  (In x A /\\ In x B /\\ ~ In x C)
  \\/ (In x A /\\ In x B /\\ ~ In x C)
  \\/ (~ In x A /\\ In x B /\\ In x C)."""
expect = "killed"
because = """Load-bearing: with the "x in A and C but not B" case lost, \
"no point lies in exactly two" no longer implies inter A B = inter A C, and the \
forward direction of sunflower_iff_no_point_in_exactly_two is false. This is the \
bridge to the polynomial-method literature, so a silent slip here would \
mis-describe what the slice rank is actually bounding. The lost case is replaced \
by a copy of the first rather than deleted, so the disjunction keeps its arity."""

[[mutation]]
id = "slicerank-ns-linear"
file = "coq/SliceRank.v"
question = """Is the exponential in the Naslund-Sawin bound doing work, or would \
a polynomial bound carry the reduction just as well?"""
find = """Definition NaslundSawinBound : Prop :=
  forall (U : list nat) (F : Family),
    NoDup U -> Distinct F -> Grounded F U ->
    ~ ContainsKSunflower 3 F ->
    (length F) ^ 3 * 4 ^ (length U)
    <= 27 * (length U + 1) ^ 3 * 27 ^ (length U)."""
replace = """Definition NaslundSawinBound : Prop :=
  forall (U : list nat) (F : Family),
    NoDup U -> Distinct F -> Grounded F U ->
    ~ ContainsKSunflower 3 F ->
    (length F) ^ 3 * 4 ^ (length U)
    <= 27 * (length U + 1) ^ 3 * 27 * (length U)."""
expect = "killed"
