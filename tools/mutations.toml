for twice. The heavy branch discharges the pure case from k <= meets X A and \
2 <= k together; drop either and it is no longer a contradiction."""

[[mutation]]
id = "purelink-sharp-surplus-off-by-one"
file = "coq/PureLink.v"
question = """The matching members meet the cover in all b of their points \
where the count charges 2, a surplus of b - 2 apiece. Is b - 2 the right \
surplus, or would b - 1 also go through?"""
find = "    2 * length F + (b - 2) * length M <= length (concat M) * (Ng + Ni)."
replace = "    2 * length F + (b - 1) * length M <= length (concat M) * (Ng + Ni)."
