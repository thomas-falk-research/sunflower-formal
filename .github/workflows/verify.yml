name: verify

on:
  push:
  pull_request:

jobs:
  coq:
    name: Coq proofs + axiom audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Coq 8.18
        run: |
          sudo apt-get update
          sudo apt-get install -y coq
          coqc --version
      - name: Build all proofs and run the Print Assumptions audit
        run: |
          make verify 2>&1 | tee /tmp/verify.log
      - name: Gate - every audited theorem must be closed
        run: |
          closed=$(grep -c "Closed under the global context" /tmp/verify.log)
          echo "closed theorems: $closed (expected 22)"
          test "$closed" -eq 22
          # No theorem in the closed table may depend on an axiom.
          ! grep -E '^  [A-Za-z_]+\.[A-Za-z_0-9]+ +Axioms:' /tmp/verify.log
      - name: Gate - the 2020 bound depends on exactly the spread-lemma axiom
        run: |
          # The derived modern bound must rest on Rao20_spread_lemma ...
          grep -q '\[axiom-dep\] Rao20_spread_lemma' /tmp/verify.log
          # ... and on nothing else: exactly one name is listed.
          names=$(sed -n 's/^  \[axiom-dep\] \([A-Za-z_][A-Za-z_0-9]*\)$/\1/p' /tmp/verify.log | wc -l)
          echo "axioms used by the modern bound: $names (expected 1)"
          test "$names" -eq 1

  rust:
    name: Rust brute-force cross-checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run the 22 small-case assertions
        run: |
          cd rust
          cargo test --release
